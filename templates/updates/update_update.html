
{% load static %}

{% block content %}

<div class="update-container">

    <!-- Background Blur -->

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="update-card">

        <!-- Top Border -->

        <div class="card-top-line"></div>

        <!-- Header -->

        <div class="update-header">

            <div class="header-icon">

                <i class="fas fa-pen-to-square"></i>

            </div>

            <div class="header-content">

                <span class="update-badge">
                    Edit Update
                </span>

                <h2>
                    Update Latest Update
                </h2>

                <p>
                    Modify and manage your latest update details.
                </p>

            </div>

        </div>

        <!-- Form -->

        <form method="POST" enctype="multipart/form-data" class="styled-form">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <!-- Current Image -->

            {% if update.image %}

            <div class="current-image-box">

                <div class="image-label">

                    <i class="fas fa-image"></i>

                    <span>
                        Current Image
                    </span>

                </div>

                <img src="{{ update.image.url }}" alt="{{ update.title }}" class="preview-image">

            </div>

            {% endif %}

            <!-- Buttons -->

            <div class="button-group">

                <a href="javascript:history.back()" class="cancel-btn">
                    <i class="fas fa-arrow-left"></i>
                    Cancel
                </a>

                <button type="submit" class="update-btn">
                    <i class="fas fa-check-circle"></i>
                    Update Now
                </button>

            </div>

        </form>

    </div>

</div>

<!-- Font Awesome -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
    :root {
        --primary: #ff6b2c;
        --primary-dark: #e85d1f;
        --primary-light: #fff1e6;
        --primary-glow: rgba(255, 107, 44, 0.2);

        --secondary: #2D2F36;

        --text-dark: #111827;
        --text-gray: #6C727F;

        --border-light: #E5E7EB;

        --bg-light: #F8FAFC;

        --white: #FFFFFF;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {

        background:
            radial-gradient(circle at top left,
                rgba(255, 107, 44, 0.12) 0%,
                transparent 28%),

            radial-gradient(circle at bottom right,
                rgba(255, 145, 77, 0.10) 0%,
                transparent 30%),

            linear-gradient(135deg,
                #fffaf7 0%,
                #fff5ef 35%,
                #fffdfb 65%,
                #fff3e8 100%);

        min-height: 100vh;

        overflow-x: hidden;
    }

    /* PAGE */

    .update-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 120px 25px 60px;
        position: relative;
        overflow: hidden;
    }

    .update-container::before {

        content: "";

        position: absolute;

        width: 520px;
        height: 520px;

        background:
            radial-gradient(circle,
                rgba(255, 107, 44, 0.18) 0%,
                rgba(255, 107, 44, 0.08) 35%,
                transparent 72%);

        top: -220px;
        left: -180px;

        border-radius: 50%;

        filter: blur(45px);

        z-index: 0;
    }


    .update-container::after {

        content: "";

        position: absolute;

        width: 450px;
        height: 450px;

        background:
            radial-gradient(circle,
                rgba(255, 166, 77, 0.16) 0%,
                transparent 72%);

        bottom: -180px;
        right: -160px;

        border-radius: 50%;

        filter: blur(55px);

        z-index: 0;
    }




    /* BACKGROUND */

    .bg-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        z-index: 0;
    }

    .shape-1 {
        width: 320px;
        height: 320px;
        background: rgba(255, 107, 44, 0.12);
        top: -80px;
        right: -80px;
    }

    .shape-2 {
        width: 280px;
        height: 280px;
        background: rgba(45, 47, 54, 0.08);
        bottom: -60px;
        left: -60px;
    }

    /* CARD */
    .update-card {

        width: 100%;

        max-width: 1050px;

        background:
            linear-gradient(145deg,
                rgba(255, 255, 255, 0.96),
                rgba(255, 249, 244, 0.96));

        backdrop-filter: blur(16px);

        border: 1px solid rgba(255, 255, 255, 0.7);

        border-radius: 32px;

        overflow: hidden;

        position: relative;

        z-index: 2;

        box-shadow:
            0 25px 60px rgba(255, 107, 44, 0.10),
            0 15px 35px rgba(0, 0, 0, 0.06);
    }


    /* SOFT INNER LIGHT */

    .update-card::before {

        content: "";

        position: absolute;

        top: -120px;
        right: -80px;

        width: 260px;
        height: 260px;

        background:
            radial-gradient(circle,
                rgba(255, 107, 44, 0.10),
                transparent 72%);

        border-radius: 50%;

        filter: blur(18px);

        z-index: 0;
    }

    .card-top-line {
        height: 5px;
        width: 100%;
        background:
            linear-gradient(90deg,
                var(--primary),
                var(--primary-dark));
    }

    /* HEADER */

    .update-header {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 45px 55px 30px;
        border-bottom: 1px solid var(--border-light);
    }

    .header-icon {
        width: 70px;
        height: 70px;
        border-radius: 24px;

        background:
            linear-gradient(145deg,
                var(--primary-light),
                #fff5ef);

        display: flex;
        justify-content: center;
        align-items: center;

        box-shadow:
            0 10px 25px var(--primary-glow);
    }

    .header-icon i {
        font-size: 32px;
        color: var(--primary);
    }

    .update-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 30px;
        background: var(--primary-light);
        color: var(--primary-dark);

        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;

        margin-bottom: 12px;
    }

    .header-content h2 {
        font-size: 32px;
        color: var(--text-dark);
        margin-bottom: 8px;
        font-weight: 700;
    }

    .header-content p {
        color: var(--text-gray);
        line-height: 1.7;
        font-size: 14px;
    }

    /* FORM */

    .styled-form {
        padding: 45px 55px 50px;
    }

    .form-fields p {
        margin-bottom: 22px;
    }

    .form-fields label {
        display: block;
        margin-bottom: 10px;
        color: var(--secondary);
        font-size: 14px;
        font-weight: 600;
    }

    /* INPUTS */

    .form-fields input,
    .form-fields textarea,
    .form-fields select {
        width: 100%;
        padding: 15px 18px;

        border-radius: 18px;

        background:
            linear-gradient(145deg,
                #ffffff,
                #fffaf7);

        border: 1.5px solid #f3dfd2;

        box-shadow:
            inset 0 1px 2px rgba(255, 255, 255, 0.8);

        font-size: 14px;
        color: var(--text-dark);

        transition: 0.3s ease;
        outline: none;
    }

    .form-fields textarea {
        min-height: 140px;
        resize: vertical;
    }

    .form-fields input:focus,
    .form-fields textarea:focus,
    .form-fields select:focus {
        border-color: var(--primary);

        background: white;

        box-shadow:
            0 0 0 5px rgba(255, 107, 44, 0.12),
            0 10px 20px rgba(255, 107, 44, 0.08);
    }

    /* FILE INPUT */

    .form-fields input[type="file"] {
        padding: 12px;
        background: var(--primary-light);
        border: 1.5px dashed var(--primary);
        cursor: pointer;
    }

    .form-fields input[type="file"]::file-selector-button {

        border: none;
        background: var(--primary);

        color: white;

        padding: 10px 18px;

        border-radius: 40px;

        margin-right: 12px;

        cursor: pointer;
    }

    /* IMAGE */

    .current-image-box {
        margin-top: 10px;
        margin-bottom: 35px;

        background: #fafafa;
        border: 1px solid var(--border-light);

        border-radius: 24px;
        overflow: hidden;
    }

    .image-label {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 14px 18px;

        background: #f3f4f6;

        color: var(--text-gray);
        font-size: 13px;
        font-weight: 600;
    }

    .image-label i {
        color: var(--primary);
    }

    .preview-image {
        width: 100%;
        max-height: 320px;
        object-fit: cover;
        display: block;
    }

    /* BUTTONS */

    .button-group {
        display: flex;
        gap: 18px;
        margin-top: 15px;
    }

    .cancel-btn,
    .update-btn {
        flex: 1;

        padding: 15px 20px;

        border: none;
        border-radius: 60px;

        text-decoration: none;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        font-size: 15px;
        font-weight: 600;

        transition: 0.3s ease;
    }

    .cancel-btn {
        background: #f3f4f6;
        color: var(--secondary);

        border: 1px solid var(--border-light);
    }

    .cancel-btn:hover {
        background: #e5e7eb;
    }

    .update-btn {
        cursor: pointer;

        color: white;

        background:
            linear-gradient(135deg,
                var(--primary),
                var(--primary-dark));

        box-shadow:
            0 12px 25px var(--primary-glow);
    }

    .update-btn:hover {
        transform: translateY(-2px);
    }

    /* RESPONSIVE */

    @media(max-width:768px) {

        .update-header {
            flex-direction: column;
            padding: 30px 25px 20px;
        }

        .styled-form {
            padding: 25px;
        }

        .header-content h2 {
            font-size: 26px;
        }

        .button-group {
            flex-direction: column;
        }

    }

    @media(max-width:500px) {

        .update-container {
            padding: 100px 15px 40px;
        }

        .update-card {
            border-radius: 24px;
        }

        .styled-form {
            padding: 22px 18px;
        }

    }

    .form-fields input[type="checkbox"] {

        width: 20px !important;
        height: 20px !important;

        accent-color: var(--primary);

        cursor: pointer;

        box-shadow: none;

        margin-top: 5px;
    }


    /* =========================
   RESPONSIVE - LARGE
========================= */

    @media(max-width:1200px) {

        .update-card {
            max-width: 90%;
        }

    }


    /* =========================
   TABLET
========================= */

    @media(max-width:992px) {

        .update-container {
            padding: 110px 20px 50px;
        }

        .update-card {
            border-radius: 28px;
        }

        .update-header {
            padding: 34px 30px 24px;
        }

        .styled-form {
            padding: 30px;
        }

        .header-content h2 {
            font-size: 28px;
        }

    }


    /* =========================
   MOBILE
========================= */

    @media(max-width:768px) {

        .update-container {
            padding: 100px 16px 40px;
        }

        .update-card {

            border-radius: 24px;

            max-width: 100%;
        }

        .update-header {

            flex-direction: column;

            align-items: flex-start;

            padding: 28px 22px 20px;

            gap: 18px;
        }

        .header-icon {

            width: 62px;
            height: 62px;

            border-radius: 18px;
        }

        .header-icon i {
            font-size: 26px;
        }

        .header-content h2 {

            font-size: 26px;

            line-height: 1.2;
        }

        .header-content p {

            font-size: 14px;

            line-height: 1.7;
        }

        .styled-form {
            padding: 24px 20px;
        }

        .form-fields input,
        .form-fields textarea,
        .form-fields select {

            padding: 14px 16px;

            border-radius: 16px;

            font-size: 14px;
        }

        .button-group {

            flex-direction: column;

            gap: 14px;
        }

        .cancel-btn,
        .update-btn {

            width: 100%;

            padding: 14px 18px;

            font-size: 14px;
        }

        .preview-image {
            max-height: 240px;
        }

    }


    /* =========================
   SMALL MOBILE
========================= */

    @media(max-width:480px) {

        .update-container {
            padding: 90px 12px 30px;
        }

        .update-header {
            padding: 24px 18px 18px;
        }

        .styled-form {
            padding: 20px 16px;
        }

        .header-content h2 {
            font-size: 22px;
        }

        .update-badge {

            font-size: 10px;

            padding: 6px 12px;
        }

        .header-icon {

            width: 56px;
            height: 56px;
        }

        .header-icon i {
            font-size: 22px;
        }

        .preview-image {
            max-height: 200px;
        }

    }


    /* =========================
   EXTRA SMALL DEVICES
========================= */

    @media(max-width:360px) {

        .header-content h2 {
            font-size: 20px;
        }

        .header-content p {
            font-size: 13px;
        }

        .form-fields label {
            font-size: 13px;
        }

        .cancel-btn,
        .update-btn {
            font-size: 13px;
        }

    }
</style>

{% endblock %}
