
{% load static %}

{% block content %}

<div class="delete-container">
    <div class="delete-modal">
        <!-- Top accent bar -->
        <div class="modal-accent"></div>

        <!-- Compact header -->
        <div class="modal-header">
            <div class="danger-chip">
                <i class="fas fa-skull-crosswalk"></i>
                <span>Danger Zone</span>
            </div>
        </div>

        <!-- Icon and title row - compact -->
        <div class="title-section">
            <div class="icon-compact">
                <i class="fas fa-trash-alt"></i>
            </div>
            <div class="title-compact">
                <h2>Delete Update</h2>
                <p>This action is irreversible</p>
            </div>
        </div>

        <!-- Update info - compact card -->
        <div class="info-compact">
            <i class="fas fa-file-signature"></i>
            <div class="info-content">
                <span class="label">Selected update</span>
                <strong class="value">{{ update.title }}</strong>
            </div>
        </div>

        <!-- Image preview if exists - compact -->
        {% if update.image %}
        <div class="image-compact">
            <div class="image-header">
                <i class="fas fa-image"></i>
                <span>Preview</span>
            </div>
            <img src="{{ update.image.url }}" alt="{{ update.title }}" class="preview-img">
        </div>
        {% endif %}

        <!-- Warning note - compact -->
        <div class="warning-compact">
            <i class="fas fa-exclamation-circle"></i>
            <span>This will permanently delete the update. No undo available.</span>
        </div>

        <!-- Action buttons - side by side -->
        <form method="POST" class="form-compact">
            {% csrf_token %}
            <div class="button-group-compact">
                <button type="submit" class="btn btn-delete">
                    <i class="fas fa-check-circle"></i>
                    <span>Confirm Delete</span>
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-cancel">
                    <i class="fas fa-arrow-left"></i>
                    <span>Cancel</span>
                </a>
            </div>
        </form>

        <!-- Footer - subtle -->
        <div class="footer-compact">
            <i class="fas fa-shield-alt"></i>
            <span>Action logged for security</span>
        </div>
    </div>
</div>

<style>
    /* ============================================
       COMPACT YET WIDE - BALANCED DELETE MODAL
       Width increased, height decreased, margins optimized
       Using provided color variables
    ============================================ */

    :root {
        --primary: #ff6b2c;
        --primary-dark: #e85d1f;
        --primary-light: #fff1e6;
        --primary-glow: rgba(255, 107, 44, 0.25);
        --secondary: #2D2F36;
        --dark-bg: #121317;
        --text-dark: #111827;
        --text-gray: #6C727F;
        --border-light: rgba(0, 0, 0, 0.06);
        --shadow-sm: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 30px 45px -18px rgba(0, 0, 0, 0.12);
        --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);

        --danger: #dc2626;
        --danger-dark: #b91c1c;
        --danger-light: #fef2f2;
        --danger-border: #fecaca;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {

        background:
            radial-gradient(circle at top left,
                rgba(255, 107, 44, 0.14) 0%,
                transparent 28%),

            radial-gradient(circle at bottom right,
                rgba(255, 145, 77, 0.12) 0%,
                transparent 32%),

            linear-gradient(135deg,
                #fffaf7 0%,
                #fff5ef 35%,
                #fffdfb 65%,
                #fff3e8 100%);

        min-height: 100vh;

        overflow-x: hidden;
    }

    .delete-container{

    display:flex;

    justify-content:center;

    align-items:center;

    width:100%;

    padding:140px 30px 80px;

}

    .delete-container {

        position: relative;

        overflow: hidden;
    }


    .delete-container::before {

        content: "";

        position: absolute;

        width: 520px;
        height: 520px;

        top: -220px;
        left: -180px;

        border-radius: 50%;

        background:
            radial-gradient(circle,
                rgba(255, 107, 44, 0.18) 0%,
                rgba(255, 107, 44, 0.08) 35%,
                transparent 72%);

        filter: blur(50px);

        z-index: 0;
    }


    .delete-container::after {

        content: "";

        position: absolute;

        width: 460px;
        height: 460px;

        bottom: -180px;
        right: -150px;

        border-radius: 50%;

        background:
            radial-gradient(circle,
                rgba(255, 166, 77, 0.16) 0%,
                transparent 72%);

        filter: blur(55px);

        z-index: 0;
    }


    /* MODAL - WIDER, LESS TALL */
    .delete-modal {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 920px;

    background:
        linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.96),
        rgba(255, 249, 244, 0.96));

    backdrop-filter: blur(18px);

    border: 1px solid rgba(255, 255, 255, 0.7);

    border-radius: 34px;

    overflow: hidden;

    box-shadow:
        0 28px 70px rgba(255, 107, 44, 0.10),
        0 15px 40px rgba(0, 0, 0, 0.07);

    transition: var(--transition);
}

    .delete-modal::before {

        content: "";

        position: absolute;

        top: -120px;
        right: -80px;

        width: 260px;
        height: 260px;

        border-radius: 50%;

        background:
            radial-gradient(circle,
                rgba(255, 107, 44, 0.10),
                transparent 72%);

        filter: blur(20px);

        z-index: 0;
    }

    .delete-modal:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md), 0 20px 30px -12px rgba(0, 0, 0, 0.15);
    }

    /* Top accent */
    .modal-accent {
        height: 4px;
        background: linear-gradient(90deg, var(--danger) 0%, var(--primary) 100%);
    }

    /* Header - compact */
    .modal-header {
        padding: 20px 28px 0 28px;
        display: flex;
        justify-content: flex-end;
    }

    .danger-chip {
        background: var(--danger-light);
        padding: 5px 12px;
        border-radius: 50px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--danger);
        border: 1px solid var(--danger-border);
    }

    .danger-chip i {
        font-size: 11px;
    }

    /* Title section - horizontal layout (icon + text side by side) */
    .title-section {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px 8px 28px;
    }

    .icon-compact {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--danger-light), #ffffff);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--danger-border);
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.12);
    }

    .icon-compact i {
        font-size: 28px;
        color: var(--danger);
    }

    .title-compact h2 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-dark);
        letter-spacing: -0.3px;
        margin-bottom: 4px;
    }

    .title-compact p {
        font-size: 13px;
        color: var(--text-gray);
    }

    /* Info card - compact, horizontal */
    .info-compact {
        background: #f8fafc;
        margin: 16px 28px;
        padding: 14px 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--border-light);
        transition: var(--transition);
    }

    .info-compact i {
        font-size: 22px;
        color: var(--primary);
        opacity: 0.8;
    }

    .info-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .info-content .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-gray);
    }

    .info-content .value {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-dark);
        word-break: break-word;
        line-height: 1.3;
    }

    /* Image preview - compact */
    .image-compact {
        margin: 12px 28px 16px 28px;
        background: #fafbfc;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--border-light);
    }

    .image-header {
        padding: 8px 14px;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-gray);
        border-bottom: 1px solid var(--border-light);
    }

    .image-header i {
        color: var(--primary);
        font-size: 12px;
    }

    .preview-img {
        width: 100%;
        max-height: 320px;
        /* Reduced height */
      object-fit:cover;

    border-radius:0 0 20px 20px;
}

    .preview-img:hover {
        transform: scale(1.02);
    }

    /* Warning note - compact, minimal */
    .warning-compact {
        background: var(--danger-light);
        margin: 12px 28px 20px 28px;
        padding: 12px 16px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-left: 3px solid var(--danger);
    }

    .warning-compact i {
        font-size: 16px;
        color: var(--danger);
    }

    .warning-compact span {
        font-size: 12px;
        font-weight: 500;
        color: #991b1b;
        line-height: 1.3;
    }

    /* Form buttons - side by side (horizontal) */
    .form-compact {
        padding: 0 28px 20px 28px;
    }

    .button-group-compact {
        display: flex;
        gap: 12px;
    }

    .btn {
        flex: 1;
        padding: 12px 16px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: none;
        font-family: 'Inter', sans-serif;
        text-decoration: none;
    }

    .btn-delete {
        background: linear-gradient(105deg, var(--danger) 0%, var(--danger-dark) 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .btn-delete:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px -8px rgba(220, 38, 38, 0.4);
    }

    .btn-delete:active {
        transform: translateY(1px);
    }

    .btn-cancel {
        background: #f1f3f5;
        color: var(--secondary);
        border: 1px solid #e2e8f0;
    }

    .btn-cancel:hover {
        background: #e5e7eb;
        transform: translateY(-1px);
    }

    .btn {

        position: relative;

        overflow: hidden;
    }


    .btn::before {

        content: "";

        position: absolute;

        top: 0;
        left: -120%;

        width: 120%;
        height: 100%;

        background:
            linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.18),
                transparent);

        transition: 0.6s;
    }


    .btn:hover::before {
        left: 120%;
    }


    /* =========================
   LARGE LAPTOP
========================= */

    @media(max-width:1200px) {

        .delete-modal {
            max-width: 90%;
        }

    }


    /* =========================
   TABLET
========================= */

    @media(max-width:992px) {

        .delete-container {

            padding: 110px 20px 50px;
        }

        .delete-modal {

            border-radius: 28px;
        }

        .title-section {

            padding: 18px 24px 8px;
        }

        .info-compact,
        .image-compact,
        .warning-compact {
            margin-left: 24px;
            margin-right: 24px;
        }

        .form-compact {
            padding: 0 24px 20px;
        }

    }


    /* =========================
   MOBILE
========================= */

    @media(max-width:768px) {

        .delete-container {

            padding: 100px 16px 40px;
        }

        .delete-modal {

            max-width: 100%;

            border-radius: 24px;
        }

        .modal-header {

            padding: 18px 20px 0;
        }

        .title-section {

            flex-direction: column;

            align-items: flex-start;

            gap: 14px;

            padding: 18px 20px 10px;
        }

        .icon-compact {

            width: 58px;
            height: 58px;

            border-radius: 18px;
        }

        .icon-compact i {
            font-size: 26px;
        }

        .title-compact h2 {

            font-size: 24px;
        }

        .title-compact p {

            font-size: 14px;

            line-height: 1.6;
        }

        .info-compact {

            margin: 14px 20px;

            padding: 14px;
        }

        .image-compact {

            margin: 12px 20px 16px;
        }

        .preview-img {
            max-height: 200px;
        }

        .warning-compact {

            margin: 12px 20px 18px;

            padding: 13px 14px;
        }

        .button-group-compact {

            flex-direction: column;

            gap: 12px;
        }

        .form-compact {
            padding: 0 20px 20px;
        }

        .btn {

            width: 100%;

            padding: 14px 18px;

            font-size: 14px;
        }

        .footer-compact {

            padding: 12px 18px;

            text-align: center;
        }

    }


    /* =========================
   SMALL MOBILE
========================= */

    @media(max-width:480px) {

        .delete-container {

            padding: 90px 12px 30px;
        }

        .delete-modal {

            border-radius: 22px;
        }

        .modal-header {

            padding: 16px 16px 0;
        }

        .title-section {

            padding: 16px;
        }

        .title-compact h2 {
            font-size: 21px;
        }

        .title-compact p {
            font-size: 13px;
        }

        .info-compact,
        .image-compact,
        .warning-compact {

            margin-left: 16px;
            margin-right: 16px;
        }

        .form-compact {
            padding: 0 16px 18px;
        }

        .preview-img {
            max-height: 180px;
        }

        .btn {
            font-size: 13px;
        }

    }


    /* =========================
   EXTRA SMALL DEVICES
========================= */

    @media(max-width:360px) {

        .title-compact h2 {
            font-size: 18px;
        }

        .danger-chip {
            font-size: 10px;
        }

        .warning-compact span {
            font-size: 11px;
        }

        .btn {
            padding: 13px 15px;
        }

    }

    /* Footer - minimal */
    .footer-compact {
        background: #fafbfc;
        padding: 12px 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-top: 1px solid var(--border-light);
        font-size: 10px;
        color: var(--text-light);
    }

    .footer-compact i {
        font-size: 11px;
        color: var(--primary);
        opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 600px) {
        .delete-modal {
            max-width: 94%;
        }

        .title-section {
            padding: 12px 20px 4px 20px;
            gap: 12px;
        }

        .info-compact {
            margin: 12px 20px;
            padding: 12px 14px;
        }

        .image-compact {
            margin: 10px 20px 14px 20px;
        }

        .warning-compact {
            margin: 10px 20px 16px 20px;
        }

        .form-compact {
            padding: 0 20px 18px 20px;
        }

        .footer-compact {
            padding: 10px 20px;
        }

        .modal-header {
            padding: 16px 20px 0 20px;
        }

        .button-group-compact {
            flex-direction: column;
            gap: 10px;
        }

        .icon-compact {
            width: 48px;
            height: 48px;
        }

        .icon-compact i {
            font-size: 24px;
        }

        .title-compact h2 {
            font-size: 20px;
        }
    }

    @media (max-width: 480px) {
        .title-section {
            flex-direction: column;
            text-align: center;
            gap: 8px;
        }

        .info-compact {
            flex-direction: column;
            text-align: center;
        }

        .warning-compact {
            text-align: center;
        }
    }

    /* Import font */
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
</style>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- Optional confirmation enhancement (UX only, backend untouched) -->
<script>
    (function () {
        const deleteForm = document.querySelector('.form-compact');
        if (deleteForm) {
            deleteForm.addEventListener('submit', function (e) {
                const confirmMsg = '⚠️ PERMANENT ACTION\n\nYou are about to delete "{{ update.title }}".\n\nThis cannot be undone.\n\nConfirm deletion?';
                if (!confirm(confirmMsg)) {
                    e.preventDefault();
                }
            });
        }
    })();
</script>

{% endblock %}
