
{% load static %}

{% block content %}

<style>
  :root {
    --orange: #FF6600;
    --orange-dark: #E65A00;
    --orange-glow: rgba(255,102,0,0.25);
    --white: #ffffff;
    --bg-glass: rgba(255,255,255,0.75);
    --text-dark: #1f1f1f;
    --text-gray: #666;
    --danger: #DC3545;
    --danger-dark: #B22234;
  }

  /* ========== BACKGROUND (same as offers page) ========== */
  .delete-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 20% 30%, #fff3e6 0%, #ffe8d6 50%, #ffd9bf 100%);
    overflow: hidden;
  }
  .delete-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('{% static "images/of-bg.webp" %}');
    background-size: cover;
    background-position: center;
    opacity: 0.2;
    mix-blend-mode: overlay;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    opacity: 0.08;
    pointer-events: none;
    animation: float 20s infinite ease-in-out;
  }
  .orb:nth-child(1) { width: 450px; height: 450px; top: -10%; left: -5%; animation-delay: 0s; }
  .orb:nth-child(2) { width: 350px; height: 350px; bottom: -8%; right: -5%; animation-delay: -7s; }
  .orb:nth-child(3) { width: 250px; height: 250px; top: 45%; left: 40%; animation-delay: -14s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.08); }
    50% { transform: translate(-30px, 40px) scale(0.92); }
    75% { transform: translate(-40px, -20px) scale(1.05); }
  }

  /* ========== LAYOUT ========== */
  .delete-page {
    /* min-height: 100vh; */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 25px 60px;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }

  /* ========== GLASS CARD ========== */
  .delete-card {
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 30px 60px rgba(0,0,0,0.08), 0 10px 30px var(--orange-glow);
    padding: 50px 40px;
    max-width: 550px;
    width: 100%;
    text-align: center;
    animation: cardPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .warning-icon {
    font-size: 3.5rem;
    margin-bottom: 15px;
  }
  h2 {
    font-size: 2.2rem;
    font-weight: 800;
    margin: 0 0 15px;
    color: var(--text-dark);
  }
  .warning-text {
    font-size: 1.15rem;
    color: var(--text-gray);
    line-height: 1.6;
    margin-bottom: 25px;
  }
  .warning-text strong {
    color: var(--orange-dark);
    font-weight: 700;
  }

  /* ========== IMAGE PREVIEW ========== */
  .offer-image {
    max-width: 100%;
    max-height: 200px;
    border-radius: 16px;
    margin: 0 auto 25px;
    display: block;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    object-fit: contain;
  }

  /* ========== BUTTONS ========== */
  .btn-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-delete {
    background: linear-gradient(135deg, var(--danger), var(--danger-dark));
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(220,53,69,0.25);
  }
  .btn-delete:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 35px rgba(220,53,69,0.4);
  }
  .btn-cancel {
    background: white;
    color: var(--text-dark);
    border: 1.5px solid #ddd;
    padding: 15px 35px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-block;
  }
  .btn-cancel:hover {
    border-color: var(--orange);
    color: var(--orange);
    background: #fff7ed;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255,102,0,0.1);
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 600px) {
    .delete-card {
      padding:35px 25px;
    }
    h2 { font-size: 1.8rem; }
    .btn-group { flex-direction: column; }
    .btn-delete, .btn-cancel { width: 100%; }
  }
  @media (max-width: 430px) {
    .delete-page {
      padding: 35px 15px 40px;
    }
  }
</style>

<!-- ========== BACKGROUND ========== -->
<div class="delete-bg">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<!-- ========== CONTENT ========== -->
<div class="delete-page">
  <div class="delete-card">
    <div class="warning-icon">⚠️</div>
    <h2>Delete Offer</h2>

    <p class="warning-text">
      Are you sure you want to permanently delete<br>
      <strong>{{ offer.title }}</strong>?
    </p>

    {% if offer.image %}
      <img src="{{ offer.image.url }}" alt="{{ offer.title }}" class="offer-image">
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="btn-group">
        <button type="submit" class="btn-delete">🗑️ Confirm Delete</button>
        <a href="{% url 'offer_list' %}" class="btn-cancel">← Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
