

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>ChecknDrop Dashboard</h2>

        <a href="{% url 'logout' %}"
           class="btn btn-danger">
            Logout
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>Total Enquiries</h5>
                    <h2>{{ total_enquiries }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>New Enquiries</h5>
                    <h2>{{ new_enquiries }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>Read Enquiries</h5>
                    <h2>{{ read_enquiries }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a href="{% url 'enquiry_list' %}"
           class="btn btn-primary">
            Manage Enquiries
        </a>
    </div>

</div>

{% endblock %}
