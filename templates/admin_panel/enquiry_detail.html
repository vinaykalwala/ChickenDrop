

{% block content %}

<div class="container py-5">

    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-5">

            <h2 class="mb-4">Enquiry Details</h2>

            <p><strong>Name:</strong> {{ enquiry.full_name }}</p>
            <p><strong>Email:</strong> {{ enquiry.email }}</p>
            <p><strong>Phone:</strong> {{ enquiry.phone_number }}</p>
            <p><strong>Subject:</strong> {{ enquiry.subject }}</p>
            <p><strong>Message:</strong></p>
            <p>{{ enquiry.message }}</p>
            <p><strong>Status:</strong> {{ enquiry.status }}</p>
            <p><strong>Created:</strong> {{ enquiry.created_at }}</p>

            <a href="{% url 'enquiry_update' enquiry.id %}"
               class="btn btn-warning">
                Edit
            </a>

            <button class="btn btn-danger"
                    onclick="deleteEnquiry({{ enquiry.id }})">
                Delete
            </button>

            <a href="{% url 'enquiry_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </div>
    </div>

</div>

<script>
function deleteEnquiry(id) {
    if (confirm("Delete this enquiry permanently?")) {
        window.location.href = `/admin/enquiries/${id}/delete/`;
    }
}
</script>

{% endblock %}
