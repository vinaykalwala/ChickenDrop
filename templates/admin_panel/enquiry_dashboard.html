

{% block content %}

<div class="container py-5">

    <h2 class="mb-4">Enquiry Dashboard</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>Total Enquiries</h5>
                    <h2>{{ total_enquiries }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>New Enquiries</h5>
                    <h2>{{ new_enquiries }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center">
                    <h5>Read Enquiries</h5>
                    <h2>{{ read_enquiries }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a href="{% url 'enquiry_list' %}"
           class="btn btn-primary">
            View All Enquiries
        </a>
    </div>

</div>

{% endblock %}
